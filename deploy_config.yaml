# Template deploy_config.yaml 
# Place this file in the root of your specific application's repository

project_name: "my_wasdi_app"
build_dir: "./.deploy_build"  # Now using a hidden directory
source_dir: "./src/my_wasdi_app"

description: "A WASDI processor for XYZ functionality"
# timeout in minutes
timeout: 180

# Rename the main entry point to WASDI's required format
entry_point:
  source: "app.py"
  target: "myProcessor.py" 

# Use this for packages installed in your active Python environment (e.g. editable installs)
installed_modules:
  - "wasdi_utils"

# Use this for modules you just want to grab by relative path (not installed)
custom_modules:
  - "../shared_utils/geo_helpers.py"

# Files and directories to strip from the final build
exclude_patterns:
  - "__pycache__"
  - "*.pyc"
  - ".env"
  - ".git"
  - ".deploy_build"

# Requirements to inject into pip.txt
pip_packages:
 - GDAL
 - geopandas
 - numpy
 - pyproj
 - rasterio
 - rioxarray
 - scipy
 - shapely
 - wasdi
