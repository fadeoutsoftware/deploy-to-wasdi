# Template deploy_config.yaml 
# Place this file in your specific application's repository

project_name: "my_wasdi_app"
build_dir: "./deploy_build"
source_dir: "./src"

# Rename the main entry point to WASDI's required format
entry_point:
  source: "app.py"
  target: "myProcessor.py" 

# Directories or files to pull from outside the standard source tree (not on PyPI)
custom_modules:
  - "../shared_utils/geo_helpers.py"

# Files and directories to strip from the final build
exclude_patterns:
  - "__pycache__"
  - "*.pyc"
  - ".env"
  - ".git"

# Requirements to inject into pip.txt
pip_packages:
  - "requests==2.31.0"
  - "geopandas>=0.12.0"